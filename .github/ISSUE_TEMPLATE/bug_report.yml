name: Bug report
description: agent-firebreak crashed or behaved incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or code to reproduce
      render: python
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agent-firebreak --version`
      placeholder: agent-firebreak 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
